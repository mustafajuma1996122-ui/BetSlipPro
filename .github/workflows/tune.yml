name: Tune model (weekly walk-forward)

on:
  schedule:
    - cron: '30 4 * * 1'        # Monday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-data
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - name: Walk-forward tuning + isotonic calibration (kept only if it helps on held-out data)
        run: python3 -m engine.run tune
      - name: Show report
        run: cat docs/backtest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit tuned parameters
        run: |
          git config user.name  "betslip-bot"
          git config user.email "betslip-bot@users.noreply.github.com"
          git add engine/params.json docs/backtest.md docs/backtest.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "tune: model parameters $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
