name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: [ "docs/**", "engine/params.json" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Engine tests (Python)
        run: python3 -m unittest discover -s tests

      - name: Unit tests and debug build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --continue \
            testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Show Kotlin errors
        if: failure()
        run: |
          grep -E "^e: |error:" build.log || echo "No e: lines found"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BET-SLIP-PRO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
