name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore: [ "docs/**", "engine/params.json" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Engine tests (Python)
        run: python3 -m unittest discover -s tests

      - name: Prepare release signing (optional, only if secrets exist)
        env:
          KS_B64: ${{ secrets.BETSLIP_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BETSLIP_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BETSLIP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BETSLIP_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BETSLIP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BETSLIP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "BETSLIP_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "BETSLIP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint, debug + release build
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BET-SLIP-PRO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (signed only if secrets were provided)
        uses: actions/upload-artifact@v4
        with:
          name: BET-SLIP-PRO-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
