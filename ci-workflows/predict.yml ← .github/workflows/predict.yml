name: Predict (free auto engine)

on:
  schedule:
    - cron: '15 */4 * * *'      # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests
        run: python3 -m unittest discover -s tests
      - name: Generate predictions, grade ledger, update metrics
        run: python3 -m engine.run predict
      - name: Commit data (ledger is append-only)
        run: |
          git config user.name  "betslip-bot"
          git config user.email "betslip-bot@users.noreply.github.com"
          git add docs/predictions.json docs/metrics.json docs/ledger.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: predictions $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
